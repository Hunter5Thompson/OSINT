name: CI

on:
  pull_request:
    branches: [main, 'review/odin-*-20261030']
  push:
    branches: [main]

# Cancel an in-flight run when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-app-images:
    name: image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: services/backend
            dockerfile: services/backend/Dockerfile
          - service: intelligence
            context: services/intelligence
            dockerfile: services/intelligence/Dockerfile
          - service: data-ingestion
            context: .
            dockerfile: services/data-ingestion/Dockerfile
          - service: frontend
            context: services/frontend
            dockerfile: services/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build actual application image from checkout
        run: |
          docker build --tag odin-image-ci:${{ matrix.service }} \
            --file ${{ matrix.dockerfile }} \
            --build-arg ODIN_BUILD_REVISION=${{ github.sha }} \
            --build-arg VITE_SPATIAL_SCOPE_ENABLED=true \
            ${{ matrix.context }}
      - name: Smoke image startup and loaded revision on an internal network
        run: python3 scripts/ops/smoke_image.py ${{ matrix.service }} odin-image-ci:${{ matrix.service }} ${{ github.sha }}
      - name: Probe baked trace transport, collector loss and socket replacement
        if: matrix.service == 'intelligence' || matrix.service == 'data-ingestion'
        run: python3 scripts/ops/smoke_trace_image.py ${{ matrix.service }} odin-image-ci:${{ matrix.service }} ${{ github.sha }}

  test-intelligence:
    name: tests · intelligence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
      # intelligence keeps dev deps (pytest, ruff) under [project.optional-dependencies],
      # which `uv sync` does NOT install by default — hence --all-extras.
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  test-data-ingestion:
    name: tests · data-ingestion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  test-backend:
    name: tests · backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    # Settings() requires NEO4J_PASSWORD at import time (no default). Tests mock
    # Neo4j, so a dummy value is enough to let the app import under pytest.
    env:
      NEO4J_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q
      - run: uv run mypy app/

  test-backend-incident-concurrency:
    name: tests · backend incident concurrency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      neo4j:
        image: neo4j:5.26.23
        env:
          NEO4J_AUTH: neo4j/hn-i04-ci-test-only
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p hn-i04-ci-test-only 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      NEO4J_PASSWORD: ci-test-password
      HN_TEST_NEO4J_URI: bolt://localhost:7687
      HN_TEST_NEO4J_PASSWORD: hn-i04-ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Bootstrap isolated-test marker
        run: |
          uv run python - <<'PY'
          import os
          from neo4j import GraphDatabase

          driver = GraphDatabase.driver(
              os.environ["HN_TEST_NEO4J_URI"],
              auth=("neo4j", os.environ["HN_TEST_NEO4J_PASSWORD"]),
          )
          driver.execute_query(
              "MERGE (:HNTestInstance {id: $marker})",
              marker="hn-i04-isolated-20260927",
          )
          driver.close()
          PY
      - name: Run opt-in real Neo4j races
        run: uv run pytest integration_tests/test_incident_concurrency.py integration_tests/test_graph_geo_events.py -q

  test-ingestion-neo4j-fixtures:
    name: tests · ingestion neo4j fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-ingestion
    services:
      neo4j:
        image: neo4j:5.26.23
        env:
          NEO4J_AUTH: neo4j/hn-b04-ci-test-only
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p hn-b04-ci-test-only 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      HN_TEST_NEO4J_URI: bolt://localhost:7687
      HN_TEST_NEO4J_PASSWORD: hn-b04-ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Bootstrap isolated-test marker
        run: |
          uv run python - <<'PY'
          import os
          from neo4j import GraphDatabase

          driver = GraphDatabase.driver(
              os.environ["HN_TEST_NEO4J_URI"],
              auth=("neo4j", os.environ["HN_TEST_NEO4J_PASSWORD"]),
          )
          driver.execute_query(
              "MERGE (:HNTestInstance {id: $marker})",
              marker="hn-i04-isolated-20260927",
          )
          driver.close()
          PY
      - name: Run opt-in real Neo4j fixtures
        run: uv run pytest integration_tests/test_nlm_claim_links.py -q

  test-ops-contracts:
    name: tests · ops contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    env:
      ODIN_ENV_FILE: tests/fixtures/compose.env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Require Docker Compose
        run: docker compose version
      - run: uv sync --locked --all-extras
      - run: uv run pytest ../../tests/ops -q

  test-vision-enrichment:
    name: tests · vision-enrichment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision-enrichment
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
      # dev deps (pytest, pytest-asyncio) live under [project.optional-dependencies].
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  test-frontend:
    name: tests · frontend
    runs-on: ubuntu-latest
    env:
      VITE_SPATIAL_SCOPE_ENABLED: "true"
      ODIN_BUILD_REVISION: ${{ github.sha }}
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run test:build-info
      - run: npm run build

  lint-python:
    name: ruff · all services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
      - run: uv sync --locked --all-extras
      - name: Ruff on all Python services (full-repo, per-service config)
        run: |
          set -euo pipefail
          # Pre-existing debt was cleared (2026-06-01); the whole tree must stay clean.
          # ruff resolves each file's [tool.ruff] config from its own service pyproject.
          uv run --locked ruff check \
            ../intelligence \
            ../data-ingestion \
            . \
            ../vision-enrichment \
            ../../scripts/ops

  guard-read-templates:
    name: guard · read templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid ORDER BY ev.timestamp on read templates (WP-08)
        run: |
          set -euo pipefail
          # ev.timestamp is never written by any write-path; read templates must
          # use coalesce(ev.timeline_at, ev.timestamp, ev.date_added) and ORDER BY
          # the projected alias. These two files are the complete read-template
          # surface that orders by event time (timeline.py uses ev.timeline_at);
          # add new paths here if more event-time read templates are introduced.
          if grep -n "ORDER BY ev.timestamp" \
              services/backend/app/routers/graph.py \
              services/intelligence/agents/tools/graph_templates.py; then
            echo "::error::Found 'ORDER BY ev.timestamp' in a read template — sort on the coalesced timestamp alias (WP-08)."
            exit 1
          fi
          echo "OK: no 'ORDER BY ev.timestamp' in read templates"
