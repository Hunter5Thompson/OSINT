[project]
name = "worldview-data-ingestion"
version = "0.1.0"
description = "Scheduled feed collectors for WorldView Tactical Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10",
    "qdrant-client>=1.13.0,<1.14.0",  # pin to Qdrant server v1.13.2 minor — avoid client/server version drift
    "structlog>=24.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "feedparser>=6.0",
    "lxml>=5.1",
    "redis>=5.0",
    "pyyaml>=6.0",
    "telethon>=1.36",
    "cryptg>=0.4",
    "polars>=1.0",
    "pyarrow>=17.0",
    "click>=8.0",
    "neo4j>=6.1.0",
    "shapely>=2.1,<2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
notebooklm = [
    "notebooklm-py[browser]",
    "playwright",
    "click>=8.0",
    "anthropic>=0.40",
    "pydub>=0.25",
    # Python 3.13 removed stdlib `audioop` (PEP 594); pydub imports it. Without this,
    # a fresh `uv sync --extra notebooklm` regresses transcription on 3.13+.
    "audioop-lts>=0.2.2; python_version >= '3.13'",
]
spatial-catalog = [
    "shapely>=2.1,<2.2",
]

[project.scripts]
odin-ingest-nlm = "nlm_ingest.cli:cli"
odin-ingest-gdelt = "gdelt_raw.cli:main"
odin-infra-atlas = "infra_atlas.cli:cli"
odin-suv-structured = "suv_structured.cli:cli"
odin-qdrant-doctor = "qdrant_doctor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = [
  "spatial_catalog/__main__.py",
  "spatial_catalog/audit.py",
  "spatial_catalog/compiler.py",
  "spatial_catalog/emit.py",
  "spatial_catalog/lod.py",
  "spatial_catalog/tools/**",
  "tests/fixtures/spatial_catalog/**",
  "tests/test_spatial_catalog_*.py",
]
include = [
  "*.py",
  "feeds/**/*.py",
  "feeds/**/*.yaml",
  "gdelt_raw/**/*.py",
  "gdelt_raw/migrations/*.cypher",
  "graph_integrity/**/*.py",
  "migrations/location_spatial_scope_indexes.cypher",
  "nlm_ingest/**/*.py",
  "nlm_ingest/prompts/*.txt",
  "infra_atlas/**/*.py",
  "infra_atlas/seeds/*.yaml",
  "infra_atlas/seeds/*.json",
  "infra_atlas/data/*.json",
  "spatial_catalog/__init__.py",
  "spatial_catalog/identity.py",
  "spatial_catalog/manifest.py",
  "spatial_catalog/models.py",
  "spatial_catalog/normalize.py",
  "spatial_catalog/source_lock.py",
  "spatial_catalog/topology.py",
  "spatial_catalog/catalog-plan.json",
  "spatial_catalog/data/country_crosswalk.json",
  "suv_structured/**/*.py",
  "suv_structured/seeds/*.yaml",
  "qdrant_doctor/*.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "duckdb>=1.5.2",
    "fakeredis>=2.35.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.8",
    "shapely>=2.1,<2.2",
]
