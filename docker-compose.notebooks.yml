# Optional immutable NotebookLM archive. Build with the matching embedding model.
# Pass this file after the selected application/release Compose files.
services:
  intelligence:
    environment:
      NOTEBOOK_CATALOG_PATH: /run/odin-notebooks/catalog.sqlite
      NOTEBOOK_CATALOG_SHA256: ${ODIN_NOTEBOOK_CATALOG_SHA256:?Set the reviewed catalog SHA-256}
      NOTEBOOK_EMBEDDING_MODEL: ${ODIN_NOTEBOOK_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      ENABLE_GDELT_DOC_TOOL: "false"
    volumes:
      - type: bind
        source: ${ODIN_NOTEBOOK_CATALOG:?Set the absolute catalog file path}
        target: /run/odin-notebooks/catalog.sqlite
        read_only: true
        bind:
          create_host_path: false
