services:
  data-ingestion:
    environment:
      - TELEGRAM_SESSION_PATH=/data/telegram/odin
      - TELEGRAM_MEDIA_PATH=/data/telegram/media

  data-ingestion-spark:
    environment:
      - TELEGRAM_SESSION_PATH=/data/telegram/odin
      - TELEGRAM_MEDIA_PATH=/data/telegram/media

  # --- Munin LoRA canary (Task 13). Reversible: delete this vllm-9b block + the
  #     intelligence SYNTHESIS_MODEL line to roll back to base-only synthesis. ---
  vllm-9b:
    # pinned digest (recorded after the AWQ+LoRA compat spike), no more :latest
    image: vllm/vllm-openai@sha256:228113d30448941e7a845f57ef0b3d3ea74ffda81be72ded4f8d6dfab0124fe6
    # full command (override replaces base command) = base + multi-LoRA serving
    command: >
      --model /models/qwen3.5-9b-awq
      --served-model-name qwen3.5
      --max-model-len 16384
      --gpu-memory-utilization 0.50
      --enforce-eager
      --limit-mm-per-prompt '{"image":0}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --enable-lora
      --max-lora-rank 16
      --lora-modules munin=/models/lora/munin
      --port 8000

  intelligence:
    # synthesis_agent -> settings.synthesis_llm_model = "munin"; react_agent stays on qwen3.5.
    environment:
      - SYNTHESIS_MODEL=munin
